[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stateshift"
version = "0.1.0"
description = "State-conditioned evaluation of reasoning recovery across RL post-training checkpoints."
authors = [
  { name="Sham Satish Thakare", email="shamthakare3000@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21.0",
  "pandas>=1.3.0",
  "scipy>=1.7.0",
  "pyyaml>=5.4.1",
  "matplotlib>=3.4.0",
  "reportlab>=3.6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
