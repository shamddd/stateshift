name: StateShift Publication Artifacts & Reproducibility CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run statistical analysis reproduction
      run: |
        python scripts/reproduce_analysis.py

    - name: Run publication artifact verification assertions
      run: |
        python scripts/verify_artifacts.py

    - name: Execute pytest suite
      run: |
        pytest tests/
